name: SEO audit and calculator regression checks

on:
  push:
    branches:
      - seo-audit-2026-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run calculator and SEO unit tests
        run: bun run test
      - name: Build and verify SEO HTML
        run: bun run build
