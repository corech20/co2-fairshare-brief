name: SEO audit and calculator regression checks

on:
  push:
    branches:
      - seo-audit-2026-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run calculator and SEO unit tests
        run: npm test
      - name: Build and verify SEO HTML
        run: npm run build
